<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Your Verification Code</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f7f7f7; margin:0; padding:20px;">
    <div style="max-width: 500px; margin:auto; background:#ffffff; padding:20px; border-radius:8px; border:1px solid #ddd; text-align:center;">
        <h2 style="color: #333;">Email Verification</h2>
        <p>Hello <strong>{{ email }}</strong>,</p>
        <p>Your One-Time Password (OTP) for registration is:</p>
        <h1 style="font-size: 32px; margin: 20px 0; color: #007bff;">{{ code }}</h1>
        <p>Please enter this code in the app to complete your registration.</p>
        <p style="color: #888; font-size: 12px; margin-top:20px;">If you did not request this, please ignore this email.</p>
        <p style="margin-top: 20px;"><strong>MLK Phone</strong></p>
    </div>
</body>
</html>
